name: Node CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Setup Mosquitto Broker
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mosquitto mosquitto-clients

      - name: Run unit tests
        run: npm test -- --runInBand

  compliance-smoke:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup Mosquitto Broker
        run: |
          sudo apt-get update -y
          sudo apt-get install -y mosquitto mosquitto-clients
          mosquitto &
          sleep 5

      - name: Clone compliance suite and install deps
        run: |
          git clone https://github.com/device-automation-bus/dab-compliance-suite.git
          pip install -r dab-compliance-suite/requirements.txt
          npm install

      - name: Run bridge and smoke compliance check
        run: |
          node src/index.js &
          sleep 3
          mosquitto_pub -t dab/bridge/template/add-device -m '{ "skipValidation": true, "ip": "sample-ip.com", "dabDeviceId": "custom-dab-device-id"}' -D publish response-topic "my/response/topic"
          timeout 120 python dab-compliance-suite/main.py --output test/ci_cd_compliance_result.json -I custom-dab-device-id -b 127.0.0.1

      - name: Check expected smoke result
        run: node test/simple_json_compare.cjs test/ci_cd_compliance_result.json test/expected_compliance_result.json logs || true

      - name: Upload compliance results
        uses: actions/upload-artifact@v4
        with:
          name: compliance-results
          path: test/ci_cd_compliance_result.json
